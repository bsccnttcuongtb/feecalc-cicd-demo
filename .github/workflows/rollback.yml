# Rollback thủ công: tab Actions -> Rollback -> Run workflow. Không build lại, chạy lại bản cũ có sẵn trên máy chủ.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Môi trường
        type: choice
        options: [uat, production]
      version:
        description: Phiên bản (bỏ trống = bản trước đó)
        required: false

env:
  DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || 'F:\GITHUB\cicd\servers' }}

jobs:
  rollback:
    runs-on: [self-hosted, windows, bsc-demo]
    environment: ${{ inputs.target }}   # rollback production cũng phải qua người duyệt
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      - name: Rollback
        shell: pwsh
        env:
          # Truyền input qua biến môi trường, không chèn thẳng ${{ }} vào script (tránh command injection)
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          $cfg = @{ uat = @{ dir = 'uat'; port = 5081; env = 'UAT' }; production = @{ dir = 'prod'; port = 5082; env = 'Production' } }[$env:TARGET]
          $p = @{ ServerRoot = "$env:DEPLOY_ROOT\$($cfg.dir)"; Port = $cfg.port; EnvName = $cfg.env }
          if ($env:VERSION) { $p.Version = $env:VERSION }
          ./deploy/rollback.ps1 @p
